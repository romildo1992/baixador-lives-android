name: Compilar APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de instalação
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Baixador_Lives_Android_v1.0.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preparar APK instalável
        run: cp app/build/outputs/apk/debug/app-debug.apk Baixador_Lives_Android_v1.0.0.apk

      - name: Criar versão para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 Baixador_Lives_Android_v1.0.0.apk \
            --title "Baixador de Lives Android v1.0.0" \
            --notes "APK instalável para Android. Permite baixar vídeos, lives, playlists e áudio MP3 quando autorizado pelo titular do conteúdo."
